# TEMPORARY: removed from this branch before the PR is merged.
# The agent preparing this PR can push files through the GitHub API but cannot
# run `git push`, and bun.lock is too large to upload that way. This job
# regenerates the lockfile for the package.json change on this branch and
# commits it back.
name: Refresh lockfile (temporary)

on:
  push:
    branches: [fix/dependency-advisories]
    paths: [package.json, .github/workflows/lockfile-refresh.yml]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-advisories

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Resolve package.json changes
        run: bun install

      # Exits 1 whenever any advisory remains unfixable within range, even after
      # applying every available fix, so the exit code is not a failure signal.
      - name: Patch vulnerable transitive dependencies within range
        run: bun audit fix || true

      - name: Confirm the lockfile is consistent
        run: bun install --frozen-lockfile

      - name: Commit bun.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock package.json
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "chore: regenerate bun.lock for next 16.4 and in-range audit fixes"
          git push
